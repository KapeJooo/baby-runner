<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baby Runner</title>
<style>
  html,body { height:100%; margin:0; background:#9edcff; color:#1f2b47;
    font-family:"Trebuchet MS","Segoe UI",sans-serif; overflow:hidden; }
  canvas { display:block; width:100%; height:100%; }
  .hud { position:fixed; left:0; right:0; top:0; padding:14px 70px 14px 18px; display:none; text-shadow:0 1px 0 rgba(255,255,255,.6);
    justify-content:space-between; pointer-events:none; font-weight:700; }
  .hint { opacity:.8; font-weight:400; }
  .lives { color:#e63a6e; font-size:1.25em; letter-spacing:.12em; }
  .powers { position:fixed; top:46px; left:0; right:0; display:none; justify-content:center; gap:10px; pointer-events:none; }
  .pw { background:rgba(255,255,255,.75); padding:4px 12px; border-radius:999px; font-weight:700; font-size:.9em; }
  body.playing .hud, body.playing .powers { display:flex; }
  .pausebtn { position:fixed; top:10px; right:12px; width:44px; height:44px; border-radius:50%; border:0; display:none;
    background:rgba(255,255,255,.85); color:#1f2b47; font-size:15px; font-weight:700; cursor:pointer; box-shadow:0 2px 8px rgba(20,40,90,.25); }
  body.playing .pausebtn { display:block; }
  .panel { padding:26px 28px; border-radius:22px; background:rgba(255,255,255,.9); text-align:center; box-shadow:0 10px 30px rgba(20,40,90,.25); }
  .panel h1, .panel h2 { margin:0 0 6px; line-height:1.05; }
  .panel h1 { font-size:clamp(30px,4.6vw,46px); }
  .panel p { margin:8px 0; }
  .panel .small { font-size:.85rem; opacity:.75; }
  #menu { position:fixed; right:7%; top:50%; transform:translateY(-62%); width:min(380px,44vw); display:none; }
  body.inmenu #menu { display:block; }
  .veil { position:fixed; inset:0; display:none; align-items:center; justify-content:center; background:rgba(20,35,80,.35); }
  body.paused .veil { display:flex; }
  .veil .panel { width:min(320px,86vw); }
  button.big { font:inherit; font-weight:700; font-size:1.3rem; padding:12px 44px; border:0; border-radius:999px; background:#ff8a3d; color:#fff;
    cursor:pointer; margin:8px 0; box-shadow:0 4px 0 #d96a1f; }
  button.big:active { transform:translateY(2px); box-shadow:0 2px 0 #d96a1f; }
  button.big.ghost { background:#fff; color:#1f2b47; box-shadow:0 4px 0 #c5cbd8; }
  button:focus-visible { outline:3px solid #1f2b47; outline-offset:3px; }
  @media (max-width:700px){ #menu { right:50%; top:4%; transform:translateX(50%); width:min(380px,90vw); padding:16px 18px; } .hint { display:none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="powers" id="powers"></div>
<button class="pausebtn" id="pauseBtn" aria-label="Pause">&#10074;&#10074;</button>
<div class="panel" id="menu">
  <h1>Baby Runner</h1>
  <p id="menuSub"></p>
  <button class="big" id="startBtn">Start</button>
  <p class="small">Space or tap to jump. Tap again in the air to double jump. P pauses.</p>
  <p class="small" id="bestLine"></p>
</div>
<div class="veil" id="pauseOv"><div class="panel">
  <h2>Paused</h2>
  <button class="big" id="resumeBtn">Resume</button><br>
  <button class="big ghost" id="menuBtn">Main menu</button>
</div></div>
<div class="hud"><span id="score">0 m</span><span class="lives" id="lives"></span><span class="hint">Space / tap: jump &middot; tap again in air: double jump</span></div>

const scoreEl = document.getElementById('score'), livesEl = document.getElementById('lives'), powersEl = document.getElementById('powers');
const $ = id => document.getElementById(id);
const startBtn = $('startBtn'), pauseBtn = $('pauseBtn'), resumeBtn = $('resumeBtn'), menuBtn = $('menuBtn');
let W, H, groundY;
function resize(){
  const dpr = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  groundY = H*0.78;
}
addEventListener('resize', resize); resize();

const SW = 72, SH = 170;            // sprite size in source pixels
const HIP_Y = 123, LEG_LEN = 44;    // hip height inside sprite, hip to sole
const HIPS = { legL:{x:21}, legR:{x:57} };


const GOAL = Number(new URLSearchParams(location.search).get('goal')) || 1000;
let t = 0, dist = 0, curSpeed = 260, cycPhase = 0, phase = 'menu', phaseT = 0, heartT = 0, paused = false, menuX = 0;
const MAXL = 3;
let lives = MAXL, inv = 0, obstacleTimer = 900;
let score = 0, bonus = 0, boostT = 0, shieldT = 0, powerTimer = Math.min(1800, GOAL*9), best = 0, newBest = false, lastPow = '';
try { best = Number(localStorage.getItem('babyRunnerBest')) || 0; } catch(e) {}
const obstacles = [], pickups = [], popups = [];
const hero = { y:0, vy:0, air:false, squash:0, flipT:9 };
const puffs = [], hearts = [];
const hills = Array.from({length:8}, (_,i)=>({x:i*260, w:200+Math.random()*180, h:60+Math.random()*90}));
const clouds = Array.from({length:6}, (_,i)=>({x:i*300, y:40+Math.random()*120, s:.6+Math.random()*.8}));
const stars = Array.from({length:40}, ()=>({x:Math.random(), y:Math.random()*.5, r:Math.random()*1.5+.4}));

const G = () => H*2.6, JV = () => Math.sqrt(2*G()*H*0.24);
const heroX = () => (phase === 'menu' && W < 700) ? W*0.5 : W*0.28;
let jumps = 0;
function jump(){
  if (phase !== 'run') return;
  if (!hero.air){ hero.vy = -JV()*(boostT>0 ? 1.25 : 1); hero.air = true; hero.squash = -0.2; jumps = 1; }
  else if (jumps < (boostT>0 ? 3 : 2)){
    hero.vy = -JV()*0.95*(boostT>0 ? 1.25 : 1); jumps++; hero.squash = -0.15; hero.flipT = 0;
    for (let i=0;i<8;i++){ const a = i/8*Math.PI*2;
      puffs.push({ x:W*0.28 + Math.cos(a)*10, y:groundY + hero.y - 30 + Math.sin(a)*10, vx:Math.cos(a)*160, vy:Math.sin(a)*160, life:1 }); }
  }
}
function updateLives(){ livesEl.textContent = '♥'.repeat(Math.max(0,lives)) + '♡'.repeat(Math.max(0,3-lives)); }
function restart(){ dist = 0; curSpeed = 260; phase = 'run'; phaseT = 0; hearts.length = 0; obstacles.length = 0;
  lives = 3; inv = 0; obstacleTimer = 900; hero.y = 0; hero.vy = 0; hero.air = false; jumps = 0; updateLives();
  bonus = 0; boostT = 0; shieldT = 0; pickups.length = 0; popups.length = 0; powerTimer = Math.min(1800, GOAL*9); newBest = false; }
function onTap(){
  if (paused || phase === 'menu') return;
  if (phase === 'done'){ if (phaseT > 10) restart(); }
  else if (phase === 'over'){ if (phaseT > .8) restart(); }
  else jump();
}
addEventListener('keydown', e => {
  if (e.code === 'KeyP' || e.code === 'Escape'){ if (phase !== 'menu') setPaused(!paused); return; }
  if (e.code === 'Space' || e.code === 'ArrowUp'){ e.preventDefault(); if (phase === 'menu') startGame(); else onTap(); }
});
addEventListener('pointerdown', e => { if (e.target.closest && e.target.closest('button')) return; onTap(); });

const bldgs = (() => { let x = 0; const a = [];
  for (let i=0;i<22;i++){ const w = 60 + Math.random()*60; a.push({ x, w, hr:.12 + Math.random()*.2, c:['#f6d6c8','#cfe3f5','#f9e4a8','#d9ead3','#e8d5f2'][i%5] }); x += w + 14 + Math.random()*30; }
  a.total = x; return a; })();
const POLE_GAP = 400;
function drawBackground(){
  const sidewalkTop = groundY - 18;
  const g = ctx.createLinearGradient(0,0,0,groundY);
  g.addColorStop(0,'#4fb6ff'); g.addColorStop(.7,'#a9defc'); g.addColorStop(1,'#e6f7ff');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,groundY);
  // sun
  const sx = W*0.8, sy = H*0.17, sr = Math.max(34, H*0.07);
  const sg = ctx.createRadialGradient(sx, sy, sr*.3, sx, sy, sr*3.2);
  sg.addColorStop(0,'rgba(255,248,190,.9)'); sg.addColorStop(1,'rgba(255,248,190,0)');
  ctx.fillStyle = sg; ctx.fillRect(sx-sr*3.2, sy-sr*3.2, sr*6.4, sr*6.4);
  ctx.fillStyle = '#ffe45e'; ctx.beginPath(); ctx.arc(sx, sy, sr, 0, 7); ctx.fill();
  // clouds
  ctx.fillStyle = 'rgba(255,255,255,.92)';
  clouds.forEach(c => {
    const x = ((c.x - dist*0.12) % (W+300) + (W+300)) % (W+300) - 150;
    ctx.beginPath(); ctx.ellipse(x, c.y, 50*c.s, 16*c.s, 0, 0, 7);
    ctx.ellipse(x+30*c.s, c.y-8*c.s, 32*c.s, 16*c.s, 0, 0, 7); ctx.fill();
  });
  // hills
  const span = hills.length*260;
  ctx.fillStyle = '#a8dcae';
  hills.forEach(h => { const x = ((h.x*1.1 - dist*0.15) % span + span) % span - 200;
    ctx.beginPath(); ctx.ellipse(x+h.w/2, sidewalkTop, h.w, h.h*1.1, 0, Math.PI, 0); ctx.fill(); });
  ctx.fillStyle = '#84cd93';
  hills.forEach(h => { const x = ((h.x*.9 + 130 - dist*0.3) % span + span) % span - 200;
    ctx.beginPath(); ctx.ellipse(x+h.w/2, sidewalkTop, h.w*.8, h.h*.7, 0, Math.PI, 0); ctx.fill(); });
  // buildings
  const bt = bldgs.total;
  for (let rep=0; rep<2; rep++){
    const off = -((dist*0.5) % bt) + rep*bt;
    bldgs.forEach(b => {
      const bx = b.x + off; if (bx > W || bx + b.w < 0) return;
      const bh = b.hr*H;
      ctx.fillStyle = b.c; ctx.fillRect(bx, sidewalkTop-bh, b.w, bh);
      ctx.fillStyle = 'rgba(255,255,255,.55)';
      for (let wy = sidewalkTop-bh+12; wy < sidewalkTop-26; wy += 26) for (let wx = bx+10; wx < bx+b.w-14; wx += 22) ctx.fillRect(wx, wy, 11, 14);
      ctx.fillStyle = 'rgba(0,0,0,.08)'; ctx.fillRect(bx, sidewalkTop-bh, b.w, 6);
    });
  }
  // sidewalk
  ctx.fillStyle = '#d9dde5'; ctx.fillRect(0, sidewalkTop, W, 18);
  ctx.fillStyle = '#c2c8d3';
  for (let i=-1;i<W/80+2;i++) ctx.fillRect(i*80 - ((dist*0.9) % 80), sidewalkTop, 2, 18);
  ctx.fillStyle = '#aab1c0'; ctx.fillRect(0, groundY-3, W, 3);
  // utility poles, wires and street lamps
  const par = 0.9, poleH = H*0.38, baseY = groundY - 6;
  const i0 = Math.floor(dist*par/POLE_GAP), offP = -((dist*par) % POLE_GAP);
  ctx.lineCap = 'round';
  for (let i=-1; i < W/POLE_GAP + 2; i++){
    const x = offP + i*POLE_GAP, topY = baseY - poleH;
    ctx.strokeStyle = '#3a3548'; ctx.lineWidth = 2;
    [-26,0,26].forEach(dx => { ctx.beginPath(); ctx.moveTo(x+dx, topY+8);
      ctx.quadraticCurveTo(x+POLE_GAP/2+dx, topY+8+H*.07, x+POLE_GAP+dx, topY+8); ctx.stroke(); });
    ctx.fillStyle = '#625a6e'; ctx.fillRect(x-4, topY, 8, poleH); ctx.fillRect(x-32, topY+14, 64, 6);
    ctx.fillStyle = '#d8dde8'; [-26,0,26].forEach(dx => ctx.fillRect(x+dx-3, topY+3, 6, 9));
    if (((i0+i) % 2 + 2) % 2 === 0){
      ctx.strokeStyle = '#625a6e'; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.moveTo(x, topY+44); ctx.quadraticCurveTo(x+6, topY+26, x+46, topY+30); ctx.stroke();
      ctx.fillStyle = '#8c8498'; ctx.beginPath(); ctx.ellipse(x+52, topY+30, 17, 6, 0, 0, 7); ctx.fill();
      ctx.fillStyle = '#fdf0b6'; ctx.beginPath(); ctx.ellipse(x+52, topY+34, 12, 4, 0, 0, 7); ctx.fill();
    }
  }
  // road
  ctx.fillStyle = '#4b5262'; ctx.fillRect(0, groundY, W, H-groundY);
  ctx.fillStyle = '#fff'; const ly = groundY + (H-groundY)*.5;
  for (let i=-1;i<W/110+2;i++) ctx.fillRect(i*110 - (dist % 110), ly, 60, 5);
}

const easeOutBack = x => { const c1=1.70158, c3=c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const easeInOut = x => x<.5 ? 2*x*x : 1 - Math.pow(-2*x+2,2)/2;

function flower(x,y,r,c){
  ctx.fillStyle = c;
  for (let i=0;i<6;i++){ const a = i*Math.PI/3;
    ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*r*.7, y+Math.sin(a)*r*.7, r*.6, r*.36, a, 0, 7); ctx.fill(); }
  ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y, r*.4, 0, 7); ctx.fill();
}
function bouquet(x, y, s, rot){
  const fl = [[-28,-60,'#ff8fab'],[0,-80,'#ffd6e0'],[28,-58,'#ff6b9d'],[-12,-46,'#fff4dc'],[14,-44,'#ffb3c6']];
  ctx.save(); ctx.translate(x,y); ctx.rotate(rot||0); ctx.scale(s,s);
  ctx.strokeStyle = '#5fae6b'; ctx.lineWidth = 4; ctx.lineCap = 'round';
  fl.forEach(f => { ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(f[0]*.9, f[1]); ctx.stroke(); });
  ctx.fillStyle = '#5fae6b';
  [[-20,-30,-.8],[20,-28,.8]].forEach(l => { ctx.beginPath(); ctx.ellipse(l[0],l[1],12,5,l[2],0,7); ctx.fill(); });
  fl.forEach(f => flower(f[0], f[1], 15, f[2]));
  ctx.fillStyle = '#f4a7c0'; ctx.strokeStyle = '#d97b9e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-26,-26); ctx.lineTo(26,-26); ctx.lineTo(3,12); ctx.lineTo(-3,12); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = '#ff6b9d'; ctx.beginPath(); ctx.ellipse(0,-20,8,5,0,0,7); ctx.fill();
  ctx.restore();
}

function drawHero(){
  const k = Math.min(H*0.36, 280) / SH;
  const cxBase = heroX();
  let xOff = 0, spinA = 0;
  const celebrating = phase==='menu' || phase==='dance' || phase==='flowers' || phase==='done';
  const moving = Math.min(1, curSpeed/260);
  const lift = Math.max(0, -hero.y);
  let aL, aR, bounce = 0, sway = 0, pulse = 0, bow = 0, lean = 0;
  if (hero.air){ aL = .9; aR = -.7; lean = .1; }
  else if (!celebrating){
    aL = Math.sin(cycPhase)*.75*moving; aR = Math.sin(cycPhase+Math.PI)*.75*moving;
    bounce = Math.abs(Math.sin(cycPhase))*5*k*moving;
    lean = .10*moving + Math.sin(cycPhase*2)*.025*moving;
  } else if (phase === 'menu'){
    // funny dance: a new silly move every 2.2 seconds
    const m = Math.floor(phaseT/2.2) % 4, u = phaseT % 2.2, d = phaseT*10;
    let tx = 0;
    if (m === 0){                       // side shuffle
      tx = Math.sin(phaseT*4)*45*k;
      aL = Math.sin(d)*.9; aR = Math.sin(d+Math.PI)*.9;
      bounce = Math.abs(Math.sin(d))*6*k; sway = Math.sin(phaseT*4)*.2;
    } else if (m === 1){                // high kicks
      aL = -Math.max(0, Math.sin(d))*1.35; aR = -Math.max(0, -Math.sin(d))*1.35;
      bounce = Math.abs(Math.sin(d))*10*k; sway = -Math.sin(d)*.12; pulse = Math.sin(d*2)*.06;
    } else if (m === 2){                // jelly wiggle
      const w = phaseT*18;
      sway = Math.sin(w)*.3; pulse = Math.sin(w*1.3)*.14;
      aL = Math.sin(w)*.5; aR = -Math.sin(w)*.5; bounce = Math.abs(Math.sin(w/2))*8*k;
    } else {                            // spin hop
      const p = Math.min(u/1.3, 1);
      spinA = easeInOut(p)*Math.PI*2; bounce = Math.sin(p*Math.PI)*55*k;
      if (p < 1){ aL = .9; aR = -.7; } else { aL = Math.sin(d)*.5; aR = -aL; pulse = Math.sin(d)*.05; }
    }
    menuX += (tx - menuX)*0.15; xOff = menuX;
  } else {
    const amp = phase==='done' ? .55 : 1, d = phaseT*9;
    aL = Math.sin(d)*.35*amp; aR = Math.sin(d+Math.PI)*.35*amp;
    bounce = Math.abs(Math.sin(d))*9*k*amp;
    sway = Math.sin(d)*.14*amp; pulse = Math.sin(d*2)*.05*amp;
    if (phase==='flowers' && phaseT < 2.4) bow = Math.sin(phaseT/2.4*Math.PI)*.32;
  }
  const cx = cxBase + xOff;
  const low = hero.air ? 1 : Math.max(Math.cos(aL), Math.cos(aR));
  const hipY = groundY - LEG_LEN*k*low - bounce - lift;

  ctx.fillStyle = 'rgba(0,0,0,.28)';
  ctx.beginPath(); ctx.ellipse(cx, groundY+4, 40*k/1.6 - lift*0.05, 8, 0, 0, 7); ctx.fill();

  ctx.save();
  if (inv > 0) ctx.globalAlpha = Math.floor(t*16) % 2 ? .35 : 1;
  let fa = spinA;
  if (hero.flipT < 0.5) fa += easeInOut(hero.flipT/0.5)*Math.PI*2;
  if (fa){
    const py = hipY - 50*k;
    ctx.translate(cx, py); ctx.rotate(fa); ctx.translate(-cx, -py);
  }

  function placeLeg(name, ang){
    ctx.save();
    ctx.translate(cx + (HIPS[name].x - SW/2)*k, hipY);
    ctx.rotate(ang);
    ctx.drawImage(imgs[name], -HIPS[name].x*k, -HIP_Y*k, SW*k, SH*k);
    ctx.restore();
  }
  placeLeg('legL', aL); placeLeg('legR', aR);

  ctx.save();
  ctx.translate(cx, hipY);
  ctx.rotate(lean + sway + bow);
  ctx.scale(1 + hero.squash + pulse, 1 - hero.squash - pulse);
  ctx.drawImage(imgs.torso, -SW/2*k, -HIP_Y*k, SW*k, SH*k);
  ctx.restore();
  ctx.restore();
  return { cx, hipY, k };
}

function drawFlowersAndText(g){
  if (phase !== 'flowers' && phase !== 'done') return;
  const u = phaseT, s0 = g.k*0.85;
  const hx = g.cx + 16*g.k, hy = g.hipY - 26*g.k;
  const tx = W*0.58, ty = H*0.66;
  let x = hx, y = hy, s = s0, rot = 0;
  if (u < 1){ s = s0*Math.max(0, easeOutBack(u)); }
  else {
    const e = easeInOut(Math.min(1, (u-1)/2.2));
    x = hx + (tx-hx)*e; y = hy + (ty-hy)*e - Math.sin(e*Math.PI)*H*0.12;
    s = s0 + (s0*2.4 - s0)*e;
    rot = Math.sin(u*3)*.05*e;
  }
  if (u > 3.3) y += Math.sin(u*2.2)*4;
  bouquet(x, y, s, rot);
  const FONT = '"Trebuchet MS","Segoe UI",sans-serif';
  const fs = Math.max(26, Math.min(52, W*0.06));
  const clamp01 = x => Math.max(0, Math.min(1, x));
  // 1) greeting, then it fades out
  const a1 = clamp01((u-2.4)/1) * (1 - clamp01((u-5.2)/.6));
  if (a1 > 0){
    ctx.save(); ctx.globalAlpha = a1; ctx.textAlign = 'center'; ctx.fillStyle = '#fff4dc';
    ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 8;
    ctx.font = `700 ${fs}px ${FONT}`;
    outText('Para sa’yo! 🌸', W*0.58, H*0.2);
    ctx.font = `400 ${fs*0.5}px ${FONT}`;
    outText('Happy ' + GOAL + ' meters!', W*0.58, H*0.2 + fs*0.8);
    ctx.restore();
  }
  // 2) the love message
  const a2 = clamp01((u-5.8)/1.2);
  if (a2 > 0){
    ctx.save(); ctx.globalAlpha = a2; ctx.textAlign = 'center';
    const line1 = 'I love you in a thousand ways,', line2 = 'asawa ko ♥';
    let f1 = fs*1.05;
    ctx.font = `700 ${f1}px ${FONT}`;
    while (ctx.measureText(line1).width > W*0.9 && f1 > 14){ f1 -= 2; ctx.font = `700 ${f1}px ${FONT}`; }
    const pulse = 1 + Math.sin(u*3)*0.025;
    ctx.shadowColor = 'rgba(255,107,157,.65)'; ctx.shadowBlur = 16;
    ctx.fillStyle = '#fff4dc';
    outText(line1, W/2, H*0.17);
    ctx.save(); ctx.translate(W/2, H*0.17 + f1*1.3); ctx.scale(pulse, pulse);
    ctx.font = `700 ${f1*1.35}px ${FONT}`;
    outText(line2, 0, 0, '#fff', '#d6336c'); ctx.restore();
    if (u > 10){
      ctx.shadowBlur = 8; ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.fillStyle = '#fff4dc';
      ctx.font = `400 ${f1*0.5}px ${FONT}`; ctx.globalAlpha = a2*.9;
      outText(scoreLine(), W/2, H*0.17 + f1*2.35);
      if (phase === 'done'){ ctx.globalAlpha = .7*(0.6+0.4*Math.sin(u*3));
        outText('tap to run again', W/2, H*0.17 + f1*3); }
    }
    ctx.restore();
  }
}

const OB = [ {kind:'moto', h:.085, w:.095}, {kind:'car', h:.115, w:.16}, {kind:'jeep', h:.17, w:.18} ];
const PALETTE = ['#e63946','#2a9d8f','#f4a261','#6a4c93','#1d6fa5','#f2c14e'], STRIPES = ['#ffd166','#ffffff','#ff6b9d'];
function spawnObstacle(){
  const hard = dist/60 >= Math.min(80, GOAL*.2), r = Math.random(), type = r < .4 ? OB[0] : (r < .8 || !hard) ? OB[1] : OB[2];
  obstacles.push({ kind:type.kind, x:W+60, w:type.w*H, h:type.h*H, hit:false,
    color:PALETTE[Math.floor(Math.random()*PALETTE.length)], color2:STRIPES[Math.floor(Math.random()*STRIPES.length)] });
  if (Math.random() < .7) spawnCoinArc(obstacles[obstacles.length-1]);
  obstacleTimer = curSpeed*0.8 + H*0.45 + Math.random()*H*0.5 + (type.kind === 'jeep' ? H*0.25 : 0);
}
function hitObstacle(o){
  if (shieldT > 0){ o.hit = true; bonus += 25; addPopup('+25', '#5aa9ff'); burst(o.x+o.w/2, groundY-o.h/2, '90,169,255', 10); return; }
  o.hit = true; lives--; inv = 1.6; curSpeed = 40; hero.squash = .25;
  for (let i=0;i<10;i++) puffs.push({ x:o.x+o.w/2, y:groundY-o.h/2, vx:(Math.random()-.5)*300, vy:-100-Math.random()*200, life:1 });
  if (lives <= 0){ phase = 'over'; phaseT = 0; pickups.length = 0; }
  updateLives();
}
function updateObstacles(dt, k, cx){
  if (phase === 'run'){
    obstacleTimer -= curSpeed*dt;
    if (obstacleTimer <= 0){
      if (dist/60 >= GOAL - Math.min(25, GOAL*.3)) obstacleTimer = 1e9;
      else if (pickups.some(p => p.kind !== 'coin' && Math.abs(p.x-(W+60)) < H*.5)) obstacleTimer = 150;
      else spawnObstacle();
    }
  }
  obstacles.forEach(o => o.x -= curSpeed*dt);
  if (phase === 'run') obstacles.forEach(o => { if (!o.hit && !o.passed && o.x+o.w < cx - 12*k){ o.passed = true; bonus += 5; } });
  while (obstacles.length && obstacles[0].x + obstacles[0].w < -50) obstacles.shift();
  if (phase !== 'run' || inv > 0) return;
  const lift = Math.max(0, -hero.y), hw = 12*k;
  for (const o of obstacles){
    if (o.hit) continue;
    if (cx+hw > o.x+4 && cx-hw < o.x+o.w-4 && lift < o.h-6){ hitObstacle(o); break; }
  }
}
function rrect(x, y, w, h, r){ ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function wheel(x, y, r){
  ctx.fillStyle = '#1d1f27'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  ctx.fillStyle = '#c9ced8'; ctx.beginPath(); ctx.arc(x, y, r*.5, 0, 7); ctx.fill();
  ctx.fillStyle = '#8a90a0'; ctx.beginPath(); ctx.arc(x, y, r*.18, 0, 7); ctx.fill();
}
function drawVehicle(o){
  const x = o.x, w = o.w, h = o.h, gy = groundY;
  if (o.kind === 'moto'){
    const r = h*.28;
    ctx.fillStyle = '#2b3a67'; rrect(x+w*.38, gy-h*.95, w*.24, h*.5, 4); ctx.fill();
    ctx.strokeStyle = '#f1c7a0'; ctx.lineWidth = h*.07; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(x+w*.5, gy-h*.82); ctx.lineTo(x+w*.12, gy-h*.7); ctx.stroke();
    ctx.fillStyle = '#f1c7a0'; ctx.beginPath(); ctx.arc(x+w*.5, gy-h*.98, h*.13, 0, 7); ctx.fill();
    ctx.fillStyle = '#e63946'; ctx.beginPath(); ctx.arc(x+w*.5, gy-h*1.0, h*.15, Math.PI, 0); ctx.fill();
    ctx.fillStyle = o.color; rrect(x+w*.32, gy-h*.6, w*.42, h*.2, 5); ctx.fill();
    ctx.strokeStyle = '#2a2d36'; ctx.lineWidth = h*.08;
    ctx.beginPath(); ctx.moveTo(x+w*.2, gy-r); ctx.lineTo(x+w*.45, gy-h*.4); ctx.lineTo(x+w*.8, gy-r); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+w*.2, gy-r); ctx.lineTo(x+w*.13, gy-h*.7); ctx.lineTo(x+w*.06, gy-h*.7); ctx.stroke();
    wheel(x+w*.2, gy-r, r); wheel(x+w*.8, gy-r, r);
    ctx.fillStyle = '#ffe45e'; ctx.beginPath(); ctx.arc(x+w*.04, gy-h*.62, h*.06, 0, 7); ctx.fill();
  } else if (o.kind === 'car'){
    const r = h*.2;
    ctx.fillStyle = o.color; rrect(x, gy-h*.56, w, h*.36, h*.1); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+w*.24, gy-h*.54); ctx.lineTo(x+w*.36, gy-h); ctx.lineTo(x+w*.72, gy-h); ctx.lineTo(x+w*.86, gy-h*.54); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#bfe6ff';
    ctx.beginPath(); ctx.moveTo(x+w*.30, gy-h*.56); ctx.lineTo(x+w*.39, gy-h*.9); ctx.lineTo(x+w*.52, gy-h*.9); ctx.lineTo(x+w*.52, gy-h*.56); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x+w*.56, gy-h*.56); ctx.lineTo(x+w*.56, gy-h*.9); ctx.lineTo(x+w*.70, gy-h*.9); ctx.lineTo(x+w*.80, gy-h*.56); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#ffe45e'; rrect(x+w*.01, gy-h*.46, w*.07, h*.1, 3); ctx.fill();
    ctx.fillStyle = '#ff4d4d'; rrect(x+w*.93, gy-h*.46, w*.06, h*.1, 3); ctx.fill();
    wheel(x+w*.22, gy-r, r); wheel(x+w*.78, gy-r, r);
  } else {
    const r = h*.17;
    ctx.fillStyle = o.color; rrect(x+w*.2, gy-h*.92, w*.8, h*.68, h*.08); ctx.fill(); rrect(x, gy-h*.52, w*.28, h*.32, h*.06); ctx.fill();
    ctx.fillStyle = o.color2; ctx.fillRect(x+w*.2, gy-h*.46, w*.8, h*.1); ctx.fillRect(x, gy-h*.42, w*.28, h*.07);
    ctx.fillStyle = '#bfe6ff'; for (let i=0;i<4;i++) ctx.fillRect(x+w*(.27+i*.17), gy-h*.82, w*.13, h*.26);
    ctx.fillStyle = '#d8dde8'; ctx.fillRect(x+w*.2, gy-h*.97, w*.8, h*.05);
    ctx.fillStyle = '#2b2d36'; ctx.fillRect(x, gy-h*.24, w, h*.05);
    ctx.fillStyle = '#ffe45e'; ctx.beginPath(); ctx.arc(x+w*.03, gy-h*.4, h*.045, 0, 7); ctx.fill();
    wheel(x+w*.16, gy-r, r); wheel(x+w*.8, gy-r, r);
  }
}
function drawObstacles(){
  obstacles.forEach(o => {
    ctx.save(); if (o.hit) ctx.globalAlpha = .35;
    ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.beginPath(); ctx.ellipse(o.x+o.w/2, groundY+4, o.w*.6, 6, 0, 0, 7); ctx.fill();
    drawVehicle(o); ctx.restore();
  });
}
function drawOver(){
  if (phase !== 'over') return;
  ctx.save(); ctx.textAlign = 'center'; ctx.fillStyle = '#fff4dc'; ctx.shadowColor = 'rgba(0,0,0,.4)'; ctx.shadowBlur = 8;
  const fs = Math.max(26, Math.min(52, W*0.06));
  ctx.font = `700 ${fs}px "Trebuchet MS","Segoe UI",sans-serif`; outText('Game over', W/2, H*0.3);
  ctx.font = `400 ${fs*0.5}px "Trebuchet MS","Segoe UI",sans-serif`;
  outText(scoreLine(), W/2, H*0.3 + fs*0.8);
  if (phaseT > .8) outText('tap to try again', W/2, H*0.3 + fs*1.5);
  ctx.restore();
}

function startGame(){ restart(); document.body.className = 'playing'; }
function showMenu(){
  restart(); phase = 'menu'; phaseT = 0; curSpeed = 70; paused = false;
  document.body.className = 'inmenu'; $('bestLine').textContent = best > 0 ? 'Best score: ' + best : '';
}
function setPaused(v){ if (phase === 'menu') return; paused = v; document.body.classList.toggle('paused', v); }
function outText(str, x, y, fill, stroke){
  const m = /(\d+(?:\.\d+)?)px/.exec(ctx.font), px = m ? +m[1] : 20;
  ctx.save(); ctx.shadowBlur = 0; ctx.lineJoin = 'round'; ctx.lineWidth = Math.max(3, px/7);
  ctx.strokeStyle = stroke || 'rgba(30,50,100,.85)'; ctx.strokeText(str, x, y);
  ctx.fillStyle = fill || '#fff'; ctx.fillText(str, x, y); ctx.restore();
}
const COL = { gold:'255,209,102', pink:'255,107,157', green:'74,222,128', blue:'90,169,255' };
function burst(x, y, c, n){ for (let i=0;i<n;i++) puffs.push({ x, y, vx:(Math.random()-.5)*320, vy:-60-Math.random()*220, life:1, c }); }
function addPopup(text, color){ popups.push({ x:W*0.28, y:groundY - Math.min(H*0.36,280)*1.05, text, color, life:1 }); }
function spawnCoinArc(o){
  const n = 5;
  for (let i=0;i<n;i++){
    const u = i/(n-1);
    pickups.push({ kind:'coin', x:o.x + o.w/2 + (u-.5)*(o.w + H*.22), h:o.h + H*.04 + Math.sin(u*Math.PI)*H*.12, r:H*.022 });
  }
}
function spawnPower(){
  const opts = [['boost',2], ['shield',2]];
  if (lives < MAXL) opts.push(['heart', 3]);
  let r = Math.random()*opts.reduce((a,b)=>a+b[1],0), kind = opts[0][0];
  for (const o of opts){ if ((r -= o[1]) <= 0){ kind = o[0]; break; } }
  pickups.push({ kind, x:W+80, h:H*.17, r:H*.04 });
  powerTimer = Math.min(3000, GOAL*20) + Math.random()*Math.min(2000, GOAL*12);
}
function collect(p){
  if (p.kind === 'coin'){ bonus += 10; burst(p.x, groundY-p.h, COL.gold, 3); return; }
  if (p.kind === 'heart'){ lives = MAXL; updateLives(); bonus += 20; addPopup('HP full!', '#ff6b9d'); burst(p.x, groundY-p.h, COL.pink, 14); }
  if (p.kind === 'boost'){ boostT = 10; bonus += 20; addPopup('Jump boost!', '#4ade80'); burst(p.x, groundY-p.h, COL.green, 14); }
  if (p.kind === 'shield'){ shieldT = 8; bonus += 20; addPopup('Shield!', '#5aa9ff'); burst(p.x, groundY-p.h, COL.blue, 14); }
}
function updatePickups(dt, k, cx){
  if (phase === 'run'){
    powerTimer -= curSpeed*dt;
    if (powerTimer <= 0){
      if (dist/60 >= GOAL - Math.min(25, GOAL*.3)) powerTimer = 1e9;
      else if (obstacles.some(o => Math.abs(o.x-(W+80)) < H*.6)) powerTimer = 150;
      else spawnPower();
    }
  }
  pickups.forEach(p => p.x -= curSpeed*dt);
  for (let i=pickups.length-1;i>=0;i--) if (pickups[i].x < -60) pickups.splice(i,1);
  popups.forEach(p => { p.y -= 40*dt; p.life -= dt*.8; });
  for (let i=popups.length-1;i>=0;i--) if (popups[i].life <= 0) popups.splice(i,1);
  if (phase !== 'run') return;
  const bottom = groundY - Math.max(0, -hero.y), top = bottom - 130*k, hw = 15*k;
  for (let i=pickups.length-1;i>=0;i--){
    const p = pickups[i], cy = groundY - p.h;
    if (Math.abs(p.x-cx) < hw+p.r && cy+p.r > top && cy-p.r < bottom){ collect(p); pickups.splice(i,1); }
  }
}
function heartPath(x, y, s){
  ctx.beginPath(); ctx.moveTo(x, y+s*.35);
  ctx.bezierCurveTo(x-s*.9, y-s*.1, x-s*.5, y-s*.8, x, y-s*.35);
  ctx.bezierCurveTo(x+s*.5, y-s*.8, x+s*.9, y-s*.1, x, y+s*.35); ctx.closePath();
}
function drawPickups(){
  pickups.forEach(p => {
    const x = p.x, y = groundY - p.h + Math.sin(t*4 + p.x*.02)*4, r = p.r;
    if (p.kind === 'coin'){
      ctx.fillStyle = '#ffd166'; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
      ctx.strokeStyle = '#e0a526'; ctx.lineWidth = 3; ctx.stroke();
      ctx.fillStyle = '#ffe9a8'; ctx.fillRect(x-r*.12, y-r*.5, r*.24, r); return;
    }
    const col = { heart:'#ff4d79', boost:'#4ade80', shield:'#5aa9ff' }[p.kind];
    ctx.fillStyle = `rgba(255,244,220,${.25 + .15*Math.sin(t*5)})`; ctx.beginPath(); ctx.arc(x, y, r+8, 0, 7); ctx.fill();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    if (p.kind === 'heart'){ heartPath(x, y+r*.05, r*.7); ctx.fill(); }
    if (p.kind === 'boost'){
      ctx.beginPath(); ctx.moveTo(x-r*.45, y-r*.05); ctx.lineTo(x, y-r*.5); ctx.lineTo(x+r*.45, y-r*.05);
      ctx.moveTo(x-r*.45, y+r*.4); ctx.lineTo(x, y-r*.05); ctx.lineTo(x+r*.45, y+r*.4); ctx.stroke();
    }
    if (p.kind === 'shield'){
      ctx.beginPath(); ctx.moveTo(x, y-r*.55); ctx.lineTo(x+r*.5, y-r*.3); ctx.lineTo(x+r*.42, y+r*.15);
      ctx.quadraticCurveTo(x+r*.3, y+r*.45, x, y+r*.62); ctx.quadraticCurveTo(x-r*.3, y+r*.45, x-r*.42, y+r*.15);
      ctx.lineTo(x-r*.5, y-r*.3); ctx.closePath(); ctx.fill();
    }
  });
}
function drawShield(g){
  if (shieldT <= 0 || (shieldT < 2 && Math.floor(t*8) % 2)) return;
  const cy = g.hipY - 60*g.k, r = 88*g.k;
  ctx.fillStyle = 'rgba(90,169,255,.18)'; ctx.beginPath(); ctx.arc(g.cx, cy, r, 0, 7); ctx.fill();
  ctx.strokeStyle = 'rgba(170,215,255,.85)'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.beginPath(); ctx.arc(g.cx, cy, r*.78, Math.PI*1.15, Math.PI*1.5); ctx.stroke();
}
function drawPopups(){
  ctx.save(); ctx.textAlign = 'center';
  popups.forEach(p => { ctx.globalAlpha = Math.max(0, Math.min(1, p.life*1.5)); ctx.fillStyle = p.color;
    ctx.font = `700 ${Math.max(20, Math.min(30, W*0.035))}px "Trebuchet MS","Segoe UI",sans-serif`; outText(p.text, p.x, p.y, p.color); });
  ctx.restore();
}
function saveBest(){
  if (score > best){ best = score; newBest = true; try { localStorage.setItem('babyRunnerBest', String(best)); } catch(e) {} }
}
function scoreLine(){ return 'Score ' + score + '  ·  Best ' + best + (newBest ? '  (new best!)' : ''); }

function spawnPuff(){ puffs.push({ x:W*0.28 - 20, y:groundY, vx:-60-Math.random()*60, vy:-30-Math.random()*40, life:1 }); }

let last = performance.now(), puffTimer = 0;
function frame(now){
  if (paused){ last = now; requestAnimationFrame(frame); return; }
  const dt = Math.min((now-last)/1000, 0.05); last = now; t += dt; phaseT += dt;
  const base = 260 + Math.min(dist/40, 220);
  const target = phase === 'run' ? base : (phase === 'menu' ? 70 : 0);
  curSpeed += (target - curSpeed) * Math.min(1, dt*(phase==='run' ? 4 : 2.2));
  if (phase !== 'run' && phase !== 'menu' && curSpeed < 8) curSpeed = 0;
  dist += curSpeed*dt;
  cycPhase += dt*(6 + 6*Math.min(1.8, curSpeed/260));
  const meters = Math.min(GOAL, Math.floor(dist/60));
  score = meters*2 + bonus;
  scoreEl.textContent = meters + ' m · ' + score + ' pts';
  if (phase !== 'run' && phase !== 'menu') saveBest();
  inv = Math.max(0, inv-dt); hero.flipT += dt; boostT = Math.max(0, boostT-dt); shieldT = Math.max(0, shieldT-dt);
  updateObstacles(dt, Math.min(H*0.36, 280)/SH, W*0.28);
  updatePickups(dt, Math.min(H*0.36, 280)/SH, W*0.28);
  if (boostT > 0 && hero.air && Math.random() < .5) puffs.push({ x:W*0.28 + (Math.random()-.5)*20, y:groundY + hero.y, vx:-40, vy:60+Math.random()*40, life:1, c:COL.green });
  const pw = (shieldT > 0 ? '<span class="pw">🛡 ' + Math.ceil(shieldT) + 's</span>' : '') + (boostT > 0 ? '<span class="pw">🚀 ' + Math.ceil(boostT) + 's</span>' : '');
  if (pw !== lastPow){ lastPow = pw; powersEl.innerHTML = pw; }

  if (phase === 'run' && dist/60 >= GOAL){ phase = 'stop'; phaseT = 0; obstacles.length = 0; pickups.length = 0; }
  else if (phase === 'stop' && curSpeed === 0 && !hero.air){ phase = 'dance'; phaseT = 0; }
  else if (phase === 'dance' && phaseT > 5.5){ phase = 'flowers'; phaseT = 0; }
  else if (phase === 'flowers' && phaseT > 3.6){ phase = 'done'; }

  if (hero.air){
    hero.vy += G()*dt; hero.y += hero.vy*dt;
    if (hero.y >= 0){ hero.y = 0; hero.vy = 0; hero.air = false; jumps = 0; hero.squash = 0.2; for(let i=0;i<6;i++) spawnPuff(); }
  } else if (curSpeed > 100){ puffTimer += dt; if (puffTimer > 0.12){ puffTimer = 0; spawnPuff(); } }
  hero.squash *= Math.pow(0.0005, dt);
  puffs.forEach(p => { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt*1.8; });
  for (let i=puffs.length-1;i>=0;i--) if (puffs[i].life <= 0) puffs.splice(i,1);

  if (phase==='menu' || phase==='dance' || phase==='flowers' || phase==='done'){
    heartT += dt;
    if (heartT > (phase === 'done' && phaseT > 5.8 ? 0.09 : 0.22)){ heartT = 0;
      hearts.push({ x:heroX() + (Math.random()-.5)*110, y:groundY - Math.min(H*0.36,280)*0.55, vx:(Math.random()-.5)*30, vy:-50-Math.random()*40, life:1, s:14+Math.random()*14, c:(phase === 'menu' ? ['#ff6b9d','#6a4c93','#2a9d8f','#f4a261'] : ['#ff6b9d','#ffb3c6','#ffd166'])[Math.floor(Math.random()*(phase === 'menu' ? 4 : 3))], g:phase === 'menu' ? ['♪','♫','★','✦'][Math.floor(Math.random()*4)] : '♥' }); }
  }
  hearts.forEach(h => { h.x += h.vx*dt + Math.sin(t*4+h.s)*0.4; h.y += h.vy*dt; h.life -= dt*0.5; });
  for (let i=hearts.length-1;i>=0;i--) if (hearts[i].life <= 0) hearts.splice(i,1);

  ctx.clearRect(0,0,W,H);
  drawBackground();
  drawObstacles();
  drawPickups();
  puffs.forEach(p => { ctx.fillStyle = `rgba(${p.c || '255,244,220'},${p.life*.6})`;
    ctx.beginPath(); ctx.arc(p.x, p.y-4, 4+(1-p.life)*8, 0, 7); ctx.fill(); });
  if (imgs.torso.complete && imgs.legL.complete && imgs.legR.complete){
    const g = drawHero();
    hearts.forEach(h => { ctx.globalAlpha = Math.max(0,h.life); ctx.fillStyle = h.c; ctx.font = `${h.s}px sans-serif`; ctx.textAlign = 'center'; ctx.fillText(h.g || '♥', h.x, h.y); });
    ctx.globalAlpha = 1;
    drawShield(g);
    drawPopups();
    drawFlowersAndText(g);
    drawOver();
  }
  requestAnimationFrame(frame);
}
startBtn.addEventListener('click', startGame);
pauseBtn.addEventListener('click', () => setPaused(true));
resumeBtn.addEventListener('click', () => setPaused(false));
menuBtn.addEventListener('click', showMenu);
document.addEventListener('visibilitychange', () => { if (document.hidden && phase !== 'menu') setPaused(true); });
$('menuSub').textContent = 'Run ' + GOAL + ' m, dodge the traffic and grab power-ups.';
$('bestLine').textContent = best > 0 ? 'Best score: ' + best : '';
document.body.className = 'inmenu';
updateLives();
requestAnimationFrame(frame);
</script>
</body>
</html>
